name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (macOS, Node 24)
    # The private development repository shares this file; only the public repository runs it.
    if: github.repository == 'hanfour/yeschef'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  error-intake:
    name: error-intake (Node 24)
    if: github.repository == 'hanfour/yeschef'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/error-intake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/error-intake/package-lock.json
      - run: npm ci
      # The acceptance harness imports ../dist, so typecheck needs a build first.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run

  error-intake-install:
    name: error-intake install (Node ${{ matrix.node }})
    # vitest and jsdom need Node 22+, so older supported versions get an install-and-load check instead of unit tests.
    if: github.repository == 'hanfour/yeschef'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: packages/error-intake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/error-intake/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke-install.mjs "$RUNNER_TEMP"/yeschef-error-intake-*.tgz
